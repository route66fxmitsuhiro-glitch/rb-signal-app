# wrangler CLI でデプロイする人向け。ダッシュボードに worker.js を貼る場合は不要
# (README.md の「A. ダッシュボードで貼る」を参照)。
#
#   npm i -g wrangler
#   wrangler kv namespace create RB_KV        # 出力された id を下の id= に貼る
#   wrangler secret put TWELVE_DATA_API_KEY
#   wrangler secret put DISCORD_WEBHOOK_URL
#   wrangler deploy

name = "rb-signal-notify"
main = "worker.js"
compatibility_date = "2026-01-01"

kv_namespaces = [
  { binding = "RB_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# 執行推奨(足の確定から90分後)を狙う。EDT: 確定=UTC21:00→推奨UTC22:30 /
# EST: 確定=UTC22:00→推奨UTC23:30。worker 側が「推奨の10分前〜確定+8時間」で
# 判定し KV で重複防止するので、どちらの季節でも通知は取引日ごとに1回だけ。
# 最後の 30 1 は遅延・失敗時のフォールバック。
[triggers]
crons = ["25 22 * * *", "25 23 * * *", "30 1 * * *"]
